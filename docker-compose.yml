services:
  postgres:
    image: postgres:16-alpine
    container_name: navan-postgres
    environment:
      POSTGRES_DB: navan_billing
      POSTGRES_USER: navan
      POSTGRES_PASSWORD: navan_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navan -d navan_billing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: